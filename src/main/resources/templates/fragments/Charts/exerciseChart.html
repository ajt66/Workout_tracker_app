<script th:inline="javascript" th:fragment="exerciseChart" defer>

    const ctx = document.getElementById('exercisesChart').getContext('2d');
    var exerciseDates = /*[[${exerciseDates}]]*/ 'default label';
    var exerciseVolume = /*[[${exerciseVolume}]]*/ 'default volume';
    var exerciseWeights = /*[[${exerciseWeights}]]*/ 'default weight';
    var exerciseReps = /*[[${exerciseReps}]]*/ 'default reps';
    var exerciseSets = /*[[${exerciseSets}]]*/ 'default sets';

    function updateexerciseChart(chart, filter) {
        chart.data.datasets.pop();
        const newDataset = {
            label: filter,
            data: exerciseFilter(filter),
            borderColor: 'rgb(54, 162, 235, 1)',
            backgroundColor: 'rgba(54, 162, 235, 0.5)',
            fill: true
        }
        chart.data.datasets.push(newDataset);
        chart.update();
    };

    function exerciseFilter(filter) {
        switch (filter) {
            case 'Volume':
                return exerciseVolume;
            case 'Weight':
                return exerciseWeights;
            case 'Reps':
                return exerciseReps;
            case 'Sets':
                return exerciseSets;
            default:
                return [];
        }
    }

    try {
        const chart = Chart.getChart('exerciseChart');
        if (typeof chart !== 'undefined' && chart !== NULL) {

            chart.data.datasets.pop();
            var filter = document.getElementById('workfilter').value;

            const datasets =
            {
                label: filter,
                data: exerciseFilter(filter),
                borderColor: 'rgb(54, 162, 235, 1)',
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                fill: true
            };
            chart.data.labels = exerciseDates;
            chart.data.datasets.push(newDataset);
            chart.update();

        } else {
            throw "new";
        }
    } catch (err) {
        const data = {
            label: exerciseDates,
            datasets: [
                {
                    label: 'filler value',
                    data: [],
                    borderColor: 'rgb(54, 162, 235, 1)',
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    fill: true
                }
            ]

        }

        var config = {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Exercise Chart'
                    }
                }
            }
        }

        var exerciseChart = new Chart(ctx, config);
    }

</script>
