<div th:fragment="exerciseChart">
    <div class="error-container">
        <p class="error" th:if="${ped == null or #lists.size(ped) == 0}">No Data available</p>
    </div>

    <script th:inline="javascript">
        (function () {
            const exercisefilter = /*[[${exercisefilter}]]*/ 'volume';
            const exerciseDates = /*[[${pel}]]*/[];

            const selection = /*[[${ped}]]*/[];
            const chart = Chart.getChart('exerciseChart');

            if (selection.length == 0) {
                document.getElementById('exerciseChart').style.display = "none";
            } else {
                document.getElementById('exerciseChart').style.display = "block";
            }

            chart.data.datasets.pop();
            const newDataset =
            {
                label: exercisefilter,
                data: selection,
                borderColor: 'rgb(54, 162, 235, 1)',
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                fill: true
            };
            chart.data.labels = exerciseDates;
            chart.data.datasets.push(newDataset);
            chart.update();

        }
        )();
    </script>
</div>
