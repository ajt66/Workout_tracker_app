<div th:fragment="breakChart">
    <p>
        <span th:text="${breakfilter}"></span>
    <ul th:each="li: ${pbd}">
        <li th:text="${li}"></li>
    </ul>
    <br>
    Labels:
    <ul th:each="mi: ${pbm}">
        <li th:text="${mi}"></li>
    </ul>
    <br>
    </p>

            if (!chart) {
                console.error('Breakdown chart is not initialized.');
                return;
            }

            chart.data.labels = breakmuscle;
            chart.data.datasets = [{
                label: breakfilter,
                data: selectedData,
                backgroundColor: [
                    'rgb(255, 99, 132)',
                    'rgb(54, 162, 235)',
                    'rgb(255, 205, 86)'
                ],
                hoverOffset: 4
            }];

            chart.update();
