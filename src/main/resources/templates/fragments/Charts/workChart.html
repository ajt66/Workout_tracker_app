<div th:fragment="workChart">
    <div class="error-container">
        <p class="error" th:if="${pwd == null or #lists.size(pwd) == 0}">No Data available</p>
    </div>

    <script type="text/javascript" th:inline="javascript">
        (() => {
            const workfilter = /*[[${workfilter}]]*/ 'volume';
            const postworklabels = /*[[${pwl}]]*/[];
            const selectedData = /*[[${pwd}]]*/[];
            const chart = Chart.getChart('workChart');

            if (!chart) {
                console.error('Workout chart is not initialized.');
                return;
            }

            if (selectedData.length == 0) {
                document.getElementById('workChart').style.display = "none";
            } else {
                document.getElementById('workChart').style.display = "block";
            }

            chart.data.labels = postworklabels;
            chart.data.datasets = [{
                label: workfilter,
                data: selectedData,
                borderColor: 'rgb(54, 162, 235, 1)',
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                fill: true
            }];
            chart.update();
        })();
    </script>
</div>
