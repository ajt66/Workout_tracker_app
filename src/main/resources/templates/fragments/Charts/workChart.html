<div th:fragment="workChart">
    <p>
        <span th:text="${workfilter}"></span>
    <ul th:each="li: ${pwd}">
        <li th:text="${li}"></li>
    </ul>
    <br>
    Labels:
    <ul th:each="li: ${pwl}">
        <li th:text="${li}"></li>
    </ul>
    <br>
    </p>

    <script type="text/javascript" th:inline="javascript">
        (() => {
            const workfilter = /*[[${workfilter}]]*/ 'volume';
            const postworklabels = /*[[${pwl}]]*/[];
            const selectedData = /*[[${pwd}]]*/[];
            const chart = Chart.getChart('workChart');

            if (!chart) {
                console.error('Workout chart is not initialized.');
                return;
            }

            chart.data.labels = postworklabels;
            chart.data.datasets = [{
                label: workfilter,
                data: selectedData,
                borderColor: 'rgb(54, 162, 235, 1)',
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                fill: true
            }];
            chart.update();
        })();
    </script>
</div>
