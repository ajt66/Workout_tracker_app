<th:block th:fragment="muscle-form(muscle)">
    <span onclick="this.parentElement.style.display='none'" class="closebtn">&times</span>
    <form th:action="@{/api/main/Exercise}" th:object="${ExerciseList}" method="post">
        <h2>Add new Abs exercise</h2>
        <div class="form-group">
            <label for="name">Enter Exercise Name :</label><br>
            <input type="text" id="name" th:field="*{exercise_name}" required>
        </div>

        <div class="form-group">
            <label for="type">Enter Exercise type :</label>
            <select th:field="*{exercise_type}">
                <option th:value="isolation" th:text="Isolation">Isolation</option>
                <option th:value="compound" th:text="Compound">Compound</option>
                <option th:value="none" th:text="None">None</option>
            </select>
        </div>

        <div class="form-group">
            <label for="muscleGroup">Muscle Group :</label>
            <input type="text" th:value="${muscle}" id="muscleGroup" th:field="*{muscle_group}" readonly>
        </div>

        <div class="form-group">
            <label for="category">Select the appropriate category :</label>
            <select th:field="*{category}">
                <option th:value="strength" th:text="Strength">Strength</option>
                <option th:value="hypertrophy" th:text="Hypertrophy">Hypertrophy</option>
            </select>
        </div>

        <button type="submit">Add Exercise</button>
    </form>
</th:block>

<th:block th:fragment="category-form(category)">
    <span onclick="this.parentElement.style.display='none'" class="closebtn">&times</span>
    <form th:action="@{/api/main/Exercise}" th:object="${ExerciseList}" method="post">
        <h2>Add new Abs exercise</h2>
        <div class="form-group">
            <label for="name">Enter Exercise Name :</label><br>
            <input type="text" id="name" th:field="*{exercise_name}" required>
        </div>

        <div class="form-group">
            <label for="type">Enter Exercise type :</label>
            <select th:field="*{exercise_type}">
                <option th:value="isolation" th:text="Isolation">Isolation</option>
                <option th:value="compound" th:text="Compound">Compound</option>
                <option th:value="none" th:text="None">None</option>
            </select>
        </div>

        <div class="form-group">
            <label for="muscleGroup">Muscle Group :</label>
            <input type="text" value="none" id="muscleGroup" th:field="*{muscle_group}" readonly>
        </div>

        <div class="form-group">
            <label for="category">Category :</label>
            <input type="text" th:value="${category}" id="category" th:field="*{category}" readonly>
        </div>

        <button type="submit">Add Exercise</button>
    </form>
</th:block>

<div th:fragment="display(Name)">
    <p>
    <h2 th:text="${Name}"></h2>
    </p>
</div>
