<th:block th:fragment="signout(Origin)">
    <span onclick="this.parentElement.style.display='none'" class="closebtn">&times</span>
    <form class="form-group" th:action="@{/api/main/sign-out}" method="post">
        <h2>Sign Out Confirmation:</h2>
        <p>Are you sure you want to sign out?</p><br>
        <input type="hidden" class="hidden-name" th:id="origin" th:name="Origin" th:value="${Origin}">
        <button class="program-button" type="submit">Sign Out</button>
        <button class="program-button" onclick="this.parentElement.style.display='none'">Cancel</button>
    </form>
</th:block>
