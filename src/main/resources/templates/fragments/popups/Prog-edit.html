<th:block th:fragment="Program_edit(Program, prog_name, prog_id)">
    <span onclick="this.parentElement.style.display='none'" class="closebtn">&times</span>
    <form class="form-group" th:action="@{/api/main/Programs/edit}" th:object="${Program}" method="put">
        <h2>Program Edit:</h2>
        <p>Click on an item/element you want to change and enter the value</p><br>
        <div>
            <label for="curProg">Program Name:</label>
            <input type="text" th:value="${prog_name}" th:field="*{prog_name}">
            <input type="hidden" th:value="${prog_id}" th:field="*{prog_id}">
        </div>

        <div class="columns-container">
            <th:block th:each="program, stat : ${Program.mapdto}">
                <div class="column-card" th:id="${program.key}">
                    <p>
                        <span th:text="${program.key}">Day</span> - <select class="prog-edit-change"
                            th:field="*{tagmap[__${program.key}__]}" th:data-day="${program.key}">
                            <!--th:id="|tagmap[${program.key}]|" th:name="|tagmap[${program.key}]|"-->
                            <option th:each="tags : ${tag}" th:value="${tags}" th:text="${tags}"></option>
                            <!--th:selected="${Program.tagmap.get(program.key)}"-->
                        </select><br>
                        <hr>
                    </p>
                    <input type="hidden" class="modified" th:id="${program.key} + '-bool'"
                        th:name="|daypair[${program.key}]|" value="false">
                    <table id="prog-edit-table">
                        <tr>
                            <th>No.</th>
                            <th>Name</th>
                            <th>Sets</th>
                            <th>Reps</th>
                            <th>duration</th>
                        </tr>
                        <th:block th:each="item, istat : ${program.value}">
                            <tr>
                                <input class="prog-edit-change" type="hidden" th:value="${item.getPlog_id()}"
                                    th:name="|mapdto[${program.key}][${istat.index}].plog_id|"
                                    th:data-day="${program.key}"><!--th:field="*{mapdto[__${program.key}__][__${istat.index}__].plog_id}"-->
                                <td><span th:text="${istat.count}">No.</td>
                                <td><input class="prog-edit-change" type="text"
                                        th:field="*{mapdto[__${program.key}__][__${istat.index}__].exercise_name}"
                                        th:data-day="${program.key}"><!--th:value="${item.getExercise_name()}"
                                        th:name="|mapdto[${program.key}][${istat.index}].exercise_name|"-->
                                </td>
                                <td><input class="prog-edit-change" type="number" th:value="${item.getSets()}"
                                        th:field="*{mapdto[__${program.key}__][__${istat.index}__].sets}"
                                        th:data-day="${program.key}"></td>
                                <!--th:name="|mapdto[${program.key}][${istat.index}].sets|"-->
                                <td><input class="prog-edit-change" type="number" th:value="${item.getReps()}"
                                        th:field="*{mapdto[__${program.key}__][__${istat.index}__].reps}"
                                        th:data-day="${program.key}"></td>
                                <!--th:name="|mapdto[${program.key}][${istat.index}].reps|"-->
                                <td><input class="prog-edit-change" type="text" th:value="${item.getDuration()}"
                                        th:field="*{mapdto[__${program.key}__][__${istat.index}__].duration}"
                                        th:data-day="${program.key}"><!--th:name="|mapdto[${program.key}][${istat.index}].duration|"-->
                                </td>
                            </tr>
                        </th:block>
                    </table>
                    <button hx-get="/api/main/Programs/edit-row"
                        th:hx-vals='|{"day":"${program.key}","index":"${program.value.size()}"}|' hx-trigger="click"
                        hx-swap="beforeend" hx-target="#prog-edit-table">Add new Row</button>
                </div>
            </th:block>
        </div>

        <button type="submit">Save Program</button>
    </form>

    <script th:inline="javascript">
        document.querySelectorAll(".prog-edit-change").forEach(el => el.addEventListener("change", function () {
            const day = el.dataset.day;
            const flag = document.getElementById(day + "-bool");
            if (flag) flag.value = "true";
        }));
    </script>
</th:block>

<th:block th:fragment="Add_Prog(dto)">
    <span onclick="this.parentElement.style.display='none'" class="closebtn">&times</span>
    <form class="form-group" th:action="@{/api/main/Programs/Add}" th:object="${dto}" method="post">
        <h2>Add Program:</h2>
        <div>
            <label for="progname">Enter program name:</label>
            <input type="text" id="progname" th:field="*{prog_name}">
        </div>

        <div class="columns-container">
            <div class="column-card" th:each="day, stat : ${dto.mapdto}">
                <p>
                    <span th:text="${day.key}">Day</span> -
                    <select th:id="${day.key} + 'tag'" th:field="*{tagmap[__${program.key}__]}">
                        <option th:each="tags : ${tag}" th:value="${tag}" th:text="${tag}"></option>
                    </select><br>
                    <hr>
                </p>
                <table id="prog-add-table">
                    <tr>
                        <th>No.</th>
                        <th>Name</th>
                        <th>Sets</th>
                        <th>Reps</th>
                        <th>duration</th>
                    </tr>
                    <th:block th:each="item, istat : ${day.value}">
                        <tr>
                            <td><span th:text="${istat.count}">No.</span></td>
                            <td><input type="text" placeholder="name"
                                    th:field="*{mapdto[__${day.key}__][__${istat.index}__].exercise_name}"></td>
                            <td><input type="number" placeholder="sets"
                                    th:field="*{mapdto[__${day.key}__][__${istat.index}__].sets}"></td>
                            <td><input type="number" placeholder="reps"
                                    th:field="*{mapdto[__${day.key}__][__${istat.index}__].reps}"></td>
                            <td><input type="text" placeholder="duration"
                                    th:field="*{mapdto[__${day.key}__][__${istat.index}__].duration}"></td>
                        </tr>
                    </th:block>
                </table>
                <button hx-get="/api/main/Programs/add-row" hx-trigger="click"
                    th:hx-vals='|{"day":"${day.key}","index":"${program.value.size()}"}|' hx-swap="beforeend"
                    hx-target="#prog-add-table">Add new Row</button>
            </div>
        </div>

        <button type="submit">Save Program</button>
    </form>
</th:block>
