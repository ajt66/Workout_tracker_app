<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600;700;800;900&family=Roboto+Slab:wght@100;300;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <nav class="navbar">
            <ul class="links-container">
                <li class="link-item"><a href="home.html">Home</a></li>
                <li class="link-item"><a href="login.html">Login</a></li>
                <li class="link-item"><a href="register.html">Register</a></li>
                <li class="link-item"><a href="home.html#support-section">Support</a></li>
            </ul>
        </nav>
    </header>

    <section class="form-section">
        <div class="form-content">
            <form th:action="@{/register/main}" th:object="${registerRequest}" method="post">
                <h2>Register</h2>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" th:field="@{username}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="text" id="email" th:field="@{email}" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" th:field="@{password}" required>
                </div>
                <button type="submit">Register</button>
            </form>
        </div>
    </section>
</body>

</html>
