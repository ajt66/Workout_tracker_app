<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600;700;800;900&family=Roboto+Slab:wght@100;300;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <nav class="navbar">
            <ul class="links-container">
                <span class="toggle-button" onclick="openNav()">&#9776;</span>
                <li class="link-item"><a onclick="openpopup('signout')" hx-get="/api/main/sign-out" hx-trigger="click"
                        hx-target="#signout" hx-vals='{"Origin": "main"}' hx-swap="innerHTML">Home</a></li>
                <li class="link-item"><a onclick="openpopup('signout')" hx-get="/api/main/sign-out" hx-trigger="click"
                        hx-target="#signout" hx-vals='{"Origin": "signout"}' hx-swap="innerHTML">Sign
                        out</a></li>
                <li class="link-item"><a href="#support-div">Support</a></li>
            </ul>
        </nav>
    </header>

    <div class="sidenav-bar" id="sidenav">
        <ul class="sidenav-container">
            <li><a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a></li>
            <li class="sidenav-links"><a href="#details">Details</a></li>
            <li class="sidenav-links"><a href="Programs.html" th:href="@{/api/main/Programs}">Programs</a></li>
            <li class="sidenav-links"><a href="dailyLog.html" th:href="@{/api/main/Logs}">Workout Logs</a></li>
            <li class="sidenav-links"><a href="Exercise.html" th:href="@{/api/main/Exercise}">Exercises</a>
            </li>
            <li class="sidenav-links"><a href="Analyze.html" th:href="@{/api/main/Analyze}">Analyze</a></li>
        </ul>
    </div>

    <div class="page-content">

        <div class="popup-container">

            <div class="popup" id="signout">
                <span onclick="this.parentElement.style.display='none'" class="closebtn">&times</span>
            </div>

        </div>

        <h1 class="welcome-heading">Welcome, <span th:text="${User_name}"></span>
        </h1>

        <div class="sidenav-content" id="details">
            <div class="content-header">
                <h2>Details</h2>
                <div class="columns-container" style="width: 50%;">
                    <div class="column">
                        <ul>
                            <li>username: <span th:text="${User_name}">username</span></li>
                            <li>email: <span th:text="${User_email}">email</span></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div>
                <button class="program-button" hx-get="/api/main/content" hx-trigger="click" hx-target="this"
                    th:hx-vals='|{"Name":"${User_name}", "Email":"${User_email}"}|' hx-swap="innerHTML">Edit
                    Content</button>
            </div>

            <div>
                <canvas id="Chart" width="400" height="200"></canvas>
                <button class="program-button" hx-get="/api/main/chart" hx-trigger="click" hx-target="#chartjs"
                    hx-swap="innerHTML">Edit Chart Content</button>
            </div>

            <script th:inline="javascript">
                const ctx = document.getElementById('Chart').getContext('2d');

                var Labels = /*[[${label}]]*/['Mon', 'Tue', 'Wed', 'Thu', 'sat'];
                var Data = /*[[${data}]]*/[2, 3, 4, 5, 6];

                const data = {
                    labels: Labels,
                    datasets: [
                        {
                            label: 'filler value',
                            data: Data,
                            borderColor: 'rgb(54, 162, 235, 1)',
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            fill: true
                        }
                    ]

                }

                const config = {
                    type: 'line',
                    data: data,
                    options: {
                        responsive: true,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Workout activity'
                            }
                        }
                    }
                }

                new Chart(ctx, config);
            </script>

            <div id="chartjs"></div>

        </div>

        <section class="footer" id="support-section">
            <!--<img src="../static/img/logo.png" class="footer-logo" alt="">-->
            <div class="footer-text">
                <p>Contact us</p>
                <p>Email - support@WTA.com</p>
                <p>Phone - 98 76 556655, 98 76 556644</p>
            </div>
        </section>
    </div>

    <script src="../static/js/post-verify.js" th:src="@{/js/post-verify.js}">
    </script>

</body>

</html>
