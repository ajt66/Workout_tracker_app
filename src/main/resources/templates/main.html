<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600;700;800;900&family=Roboto+Slab:wght@100;300;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>

<body>
    <header>
        <nav class="navbar">
            <ul class="links-container">
                <li class="link-item"><a href="home.html" th:href="@{/api/home}">Home</a></li>
                <li class="link-item"><a href="sign-out.html" th:href="@{/api/sign-out}">Sign out</a></li>
                <li class="link-item"><a href="#support-div">Support</a></li>
            </ul>
        </nav>
    </header>

    <div class="sidenav-bar" id="sidenav">
        <ul class="sidenav-container">
            <li><a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a></li>
            <li class="sidenav-links"><a href="#details">Details</a></li>
            <li class="sidenav-links"><a href="Programs.html" th:href="@{/api/Programs}">Programs</a></li>
            <li class="sidenav-links"><a href="Schedule.html" th:href="@{/api/Schedule}">Schedule</a></li>
            <li class="sidenav-links"><a href="Exercise.html" th:href="@{/api/Exercise}">Exercises</a>
            </li>
            <li class="sidenav-links"><a href="Analyze.html" th:href="@{/api/Analyze}">Analyze</a></li>
        </ul>
    </div>

    <span class="toggle-button" onclick="openNav()">&#9776;</span>

    <div class="page-content">


        <h1 class="welcome-heading">Welcome, <span th:text="${User.getUserName()}"></span>
        </h1>

        <div class="sidenav-content" id="details">
            <div class="content-header">
                <h2>Details</h2>
                <p><span th:text="${User.getUserName()}">username</span></p>
                <p><span th:text="${User.getEmail()}">email</span></p>
                <p><span th:text="${User.getPassword()}">password</span></p>
                <p><span th:text="${User.getRole()}">role</span></p>
                <p><span th:text="${User.getCreatedAt()}">created at</span></p>
            </div>
        </div>

        <section class="footer" id="support-section">
            <!--<img src="../static/img/logo.png" class="footer-logo" alt="">-->
            <div class="footer-text">
                <p>Contact us</p>
                <p>Email - support@WTA.com</p>
                <p>Phone - 98 76 556655, 98 76 556644</p>
            </div>
        </section>
    </div>

    <script>

        window.onload = function () {
            const activeTab = localStorage.getItem('activeTab');
            if (activeTab) {
                document.getElementById(activeTab).click();
            } else {
                document.getElementById("detailstab").click();
            }
        };

        function opentab(evt, tabName) {
            var i, tabcontent, tablinks;

            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }

            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }

            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
            localStorage.setItem('activeTab', evt.currentTarget.id);
        }

        function openNav() {
            document.getElementById("sidenav").classList.add("open");
        }

        function closeNav() {
            document.getElementById("sidenav").classList.remove("open");
        }

    </script>

</body>

</html>
